name: Release

# A tag `v<VERSION>.<n>` (e.g. v1.0.0) publishes a GitHub release with the
# public surface, index/, as one zip. Consumers can then take a named version
# from one URL instead of cloning the repository, and build without the network
# from the downloaded file. The zip holds exactly what index/manifest.csv
# covers plus the two READMEs, so its manifest verifies it.
# tag `v<VERSION>.<n>` を push すると、公開面 index/ を1つの zip にして release に付ける。
# 利用者は clone せずに名前の付いた版を1つの URL から取れる。
#
# The tag's major number must equal index/VERSION. VERSION stays 1 until the
# first formal release and is raised for a breaking change after it, so a tag
# whose major number differs would promise compatibility the data does not have.
# tag の先頭の数は index/VERSION と一致しなければならない（VERSION は正式リリースまで 1、その後は壊す変更で上げる）。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check the tag against index/VERSION
        run: |
          major="${GITHUB_REF_NAME#v}"
          major="${major%%.*}"
          version="$(tr -d '[:space:]' < index/VERSION)"
          if [ "$major" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match index/VERSION $version" >&2
            exit 1
          fi

      # The release must be the surface the checks accept, not merely what the
      # tag happens to point at.
      - name: Check tables and documents
        run: |
          python tools/check_tables.py
          python tools/check_baseline.py
          python tools/check_docs.py

      - name: Build the zip
        run: |
          name="ch32-device-data-index-${GITHUB_REF_NAME}"
          mkdir -p "dist/$name"
          cp index/*.csv index/VERSION index/README.md index/README.ja.md "dist/$name/"
          (cd dist && zip -qr "$name.zip" "$name")
          echo "ZIP=dist/$name.zip" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "$GITHUB_REF_NAME" \
            --notes "Public surface (index/) at $(git rev-parse --short HEAD). index/VERSION $(cat index/VERSION). Verify the files against manifest.csv."

name: Release

# A tag `v<major>.<minor>...` (e.g. v1.0.0) publishes a GitHub release with the
# public surface, index/, as one zip. Consumers can then take a named release
# from one URL instead of cloning the repository, and build without the network
# from the downloaded file. The zip holds exactly what index/manifest.csv
# covers plus the two READMEs, so its manifest verifies it. The data carries no
# version number of its own; breaking changes go in the release notes.
# tag `v<major>.<minor>…` を push すると、公開面 index/ を1つの zip にして release に付ける。
# 利用者は clone せずに名前の付いた版を1つの URL から取れる。データの中に版の番号は持たない。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The release must be the surface the checks accept, not merely what the
      # tag happens to point at.
      - name: Check tables and documents
        run: |
          python tools/check_tables.py
          python tools/check_baseline.py
          python tools/check_docs.py

      - name: Build the zip
        run: |
          name="ch32-device-data-index-${GITHUB_REF_NAME}"
          mkdir -p "dist/$name"
          cp index/*.csv index/README.md index/README.ja.md "dist/$name/"
          (cd dist && zip -qr "$name.zip" "$name")
          echo "ZIP=dist/$name.zip" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "$GITHUB_REF_NAME" \
            --notes "Public surface (index/) at $(git rev-parse --short HEAD). Verify the files against manifest.csv. Breaking changes, if any, are listed below."

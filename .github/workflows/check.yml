name: Check tables

# Runs when the data or the tools that generate it actually change -- on push
# and pull request -- unlike the daily catalogue job, whose only moving input
# is documents.json. Verifies that every reference between the normalised
# tables still joins.
# データが実際に変わるのはpush/PR時なので、参照結合の検査はそこで行う。

on:
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "evidence/**"
      - "index/**"
      - "tools/**"
      - "curated/**"
      - "manifests/**"
      # The documents claim row counts and hole states; check_docs.py verifies
      # them against the tables, so editing a document has to run this too.
      - "docs/**"
      - "README*.md"
      - "pins.html"
  pull_request:
    paths:
      - "catalog/**"
      - "evidence/**"
      - "index/**"
      - "tools/**"
      - "curated/**"
      - "manifests/**"
      - "docs/**"
      - "README*.md"
      - "pins.html"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Only tools/check_viewer.js needs it. The runner image ships node, but
      # pinning it here means the check does not depend on that staying true.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Standard library only.
      - name: Check table joins
        run: python tools/check_tables.py

      # The freeze ledger records rows+SHA-256 of every canonical CSV, and
      # unfreezing is supposed to be an explicit act that re-records it. Nothing
      # read the ledger, so the promise could be forgotten silently: on
      # 2026-09-06 twenty-seven tables had drifted away from it (the tables were
      # right, the ledger was five days behind). A rot detector that nothing
      # runs rots too.
      # Standard library only.
      - name: Check the freeze ledger
        run: python tools/check_baseline.py

      # Data can be right while the prose that explains it is stale, and the
      # prose is what a reader sees. Found 2026-08-29: seven documents and a
      # tool's docstring still called the WCH-Link version numbering unresolved
      # after it had been settled, and table-reliability's pinout row count was
      # five rows behind.
      # Standard library only.
      - name: Check document claims
        run: python tools/check_docs.py

      # pins.html holds real logic now (which columns, what a search matches,
      # which instances a part number does not have) and it used to be the one
      # thing nothing checked: its series view read only the first part number
      # of a series for months, which left CH32V006's debug and UART defaults
      # blank. Evaluated headlessly against the committed tables -- no browser.
      - name: Check the viewer
        run: node tools/check_viewer.js

      # The normalisation rules (vocabulary, figure captions, lost subscripts,
      # line rejoining, symbol/value spelling) are documented by their doctests
      # and by nothing else, so a rule changed without its examples fails here.
      # This used to be two steps naming six files by hand, which is how the
      # other twelve files -- 100 of the 161 examples, including every rule in
      # operating_rows and extract_remap -- went unrun in CI. The check sweeps
      # `pipeline/` and `tools/` instead of naming anything, and fails when a
      # file containing `>>>` yields no examples (a real trap: doctest.testmod
      # silently collects nothing from a second module instance).
      #
      # Standard library only: two modules used to pull pdfplumber in at import
      # time and now import it where they open a PDF.
      - name: Doctests
        run: python pipeline/checks/check_doctests.py

      # Everything derivable without a PDF must already be committed in its
      # regenerated form. This used to cover catalog/documents.csv only, and the
      # two things it did not cover both went stale unnoticed (found 2026-08-28):
      # generated/readme/CH32V003.md still showed EVT v2.1 after the catalogue
      # moved to v1.0, and evidence/remap_routes.csv still carried the two
      # derived columns that the 2026-08-26 layout change had removed from
      # ROUTE_COLUMNS -- the tool and the file were two days apart.
      #
      # The order is the dependency order: documents.csv feeds the READMEs,
      # index/features.csv and index/capabilities.csv are hashed into
      # index/manifest.csv, and the READMEs read index/. All five generators are
      # standard library only and take seconds, which is why they can run here
      # at all.
      #
      # **evidence/ is out of reach on purpose.** Those tables come from the
      # datasheets and the EVT trees, which this job does not have; their
      # freshness is what `catalog/sources.csv` and a manual full run cover.
      - name: Derived tables and READMEs are up to date
        run: |
          python tools/build_documents.py
          python tools/build_feature_tags.py
          python tools/build_capabilities.py
          python tools/build_conflicts.py
          python tools/build_debug_interfaces.py
          python tools/build_index.py
          python tools/build_readme.py
          git diff --exit-code -- catalog/documents.csv index/ generated/readme/ \
            || { echo "::error::a generated file is stale -- re-run the generators and commit"; exit 1; }
